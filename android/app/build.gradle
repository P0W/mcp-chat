apply plugin: 'com.android.application'

android {
    namespace "dev.prashants.mcpchat"
    compileSdk rootProject.ext.compileSdkVersion

    def rawVersionCode = (
        project.findProperty("appVersionCode")
            ?: System.getenv("APP_VERSION_CODE")
            ?: "1"
    ).toString()
    def resolvedVersionCode
    try {
        resolvedVersionCode = Integer.parseInt(rawVersionCode)
    } catch (NumberFormatException ex) {
        throw new GradleException("Invalid app version code '${rawVersionCode}'. Use a numeric value for appVersionCode/APP_VERSION_CODE.")
    }
    def resolvedVersionName = (
        project.findProperty("appVersionName")
            ?: System.getenv("APP_VERSION_NAME")
            ?: "1.0.0"
    )
    if (!(resolvedVersionName ==~ /\d+\.\d+\.\d+([.-].+)?/)) {
        throw new GradleException("Invalid app version name '${resolvedVersionName}'. Use semantic version format like 1.0.1.")
    }

    defaultConfig {
        applicationId "dev.prashants.mcpchat"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode resolvedVersionCode
        versionName resolvedVersionName
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        // Stable debug keystore committed at android/debug.keystore so every
        // local and CI debug build signs with the same key and in-place
        // upgrades work on the device. Password is the well-known Android
        // debug password — this keystore is intentionally non-secret.
        debug {
            def ks = file("../debug.keystore")
            if (ks.exists()) {
                storeFile ks
                storePassword "android"
                keyAlias "androiddebugkey"
                keyPassword "android"
            } else {
                throw new GradleException(
                    "Missing android/debug.keystore. Generate it with: " +
                    "keytool -genkeypair -v -storetype JKS -keystore android/debug.keystore " +
                    "-alias androiddebugkey -storepass android -keypass android " +
                    "-keyalg RSA -keysize 2048 -validity 10000 " +
                    "-dname \"CN=Android Debug,O=Android,C=US\""
                )
            }
        }
        // Release keystore is supplied via environment variables so it is
        // never committed to the repository. Set RELEASE_STORE_FILE to the
        // absolute path of the keystore file and the three password/alias
        // variables before invoking assembleRelease. The CI workflow decodes
        // the RELEASE_KEYSTORE_B64 GitHub secret and sets these variables
        // automatically; local release builds fall back to the debug key.
        release {
            def ksPath = System.getenv("RELEASE_STORE_FILE")
            if (ksPath) {
                storeFile     file(ksPath)
                storePassword System.getenv("RELEASE_STORE_PASSWORD") ?: ""
                keyAlias      System.getenv("RELEASE_KEY_ALIAS")      ?: ""
                keyPassword   System.getenv("RELEASE_KEY_PASSWORD")   ?: ""
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            // Use the dedicated release key when env vars are present (CI).
            // Fall back to the debug key for local builds so the APK is still
            // installable, but note that debug-signed release APKs will be
            // flagged by Google Play Protect as potentially harmful.
            signingConfig System.getenv("RELEASE_STORE_FILE") \
                ? signingConfigs.release : signingConfigs.debug
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
