name: Bootstrap release keystore

# One-shot workflow: generates a release keystore with a unique certificate DN
# and prints it as a base64 string so you can store it as repository secrets.
#
# Usage:
#   1. Actions tab → "Bootstrap release keystore" → Run workflow.
#   2. Open the job log and copy the four values printed under
#      "=== GITHUB SECRETS TO ADD ===".
#   3. Go to Settings → Secrets and variables → Actions and add:
#        RELEASE_KEYSTORE_B64   ← the long base64 block
#        RELEASE_STORE_PASSWORD ← the generated store password
#        RELEASE_KEY_ALIAS      ← release
#        RELEASE_KEY_PASSWORD   ← the generated key password
#   4. Re-run the android.yml workflow — release APKs will now be signed with
#      this unique key instead of the well-known debug certificate.
#
# The keystore is printed only to the job log (which is private for private
# repos). For public repos, rotate the key and update the secrets if the log
# is visible to untrusted parties.

on:
  workflow_dispatch:

permissions:
  contents: none

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Generate release keystore
        run: |
          STORE_PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 32)
          KEY_PASS=$(openssl rand -base64 24 | tr -dc 'A-Za-z0-9' | head -c 32)

          keytool -genkeypair -v \
            -keystore /tmp/release.keystore \
            -storetype PKCS12 \
            -storepass "$STORE_PASS" \
            -alias release \
            -keypass "$KEY_PASS" \
            -keyalg RSA \
            -keysize 4096 \
            -validity 10950 \
            -dname "CN=MCP Chat,O=P0W,C=US"

          KS_B64=$(base64 -w 0 /tmp/release.keystore)

          echo ""
          echo "=== GITHUB SECRETS TO ADD ==="
          echo "RELEASE_KEYSTORE_B64=${KS_B64}"
          echo "RELEASE_STORE_PASSWORD=${STORE_PASS}"
          echo "RELEASE_KEY_ALIAS=release"
          echo "RELEASE_KEY_PASSWORD=${KEY_PASS}"
          echo "=============================="
