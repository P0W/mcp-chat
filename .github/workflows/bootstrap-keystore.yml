name: Bootstrap debug keystore

# One-shot workflow: generates android/debug.keystore in CI and commits it
# back to main, so every subsequent APK build signs with the same key and
# in-place upgrades work on the device.
#
# Run once via: Actions tab -> "Bootstrap debug keystore" -> Run workflow.
# After it commits the file, you can delete this workflow file if you like
# (the main android.yml will keep using the committed keystore).

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Refuse to overwrite existing keystore
        run: |
          if [ -f android/debug.keystore ]; then
            echo "::error::android/debug.keystore already exists. Delete it from the repo first if you really want to regenerate."
            exit 1
          fi

      - name: Generate debug keystore
        run: |
          keytool -genkeypair -v \
            -keystore android/debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10950 \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Commit and push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add android/debug.keystore
          git commit -m "chore(android): add committed debug keystore for stable signing"
          git push
